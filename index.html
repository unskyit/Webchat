<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Webchat</title>
  <!-- Dynamic Status Bar Meta Tag -->
  <meta name="theme-color" id="meta-theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
</head>
<body class="light-mode">
  
  <header class="app-header">
    <div class="header-content">
      <div class="brand-group">
        <h2 class="brand">Webchat</h2>
        <small class="brand-sub">by unskyit.com</small>
      </div>
      <div id="header-actions"></div> 
    </div>
  </header>

  <div id="custom-alert-overlay" class="hidden">
    <div class="custom-alert-box">
      <h3 id="custom-alert-title">Notice</h3>
      <p id="custom-alert-text"></p>
      <button id="custom-alert-btn" class="btn-success">OK</button>
    </div>
  </div>

  <div id="settings-overlay" class="hidden">
    <div class="settings-card">
      <h3 style="margin-bottom: 20px; color: var(--text-main);">Settings</h3>
      <button id="btn-install-pwa" class="btn-success hidden" style="margin-bottom: 20px;">📲 Install App</button>
      
      <div class="setting-data-usage" id="metrics-hud" style="display: none;">
        <div class="metric-row"><span>Session Time:</span> <strong id="session-timer">00:00</strong></div>
        <div class="metric-row" style="border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 8px;">
          <span>Live Speed:</span> <strong id="transfer-speed">0 MB/s</strong>
        </div>
        <small>Total Data Used:</small>
        <div id="data-counter">0 MB ⬆ | 0 MB ⬇</div>
      </div>

      <div class="setting-row">
        <div class="setting-text"><span>Dark Mode</span></div>
        <label class="switch"><input type="checkbox" id="toggle-theme"><span class="slider"></span></label>
      </div>
      <div class="setting-row">
        <div class="setting-text"><span>Sound Effects</span></div>
        <label class="switch"><input type="checkbox" id="toggle-sound" checked><span class="slider"></span></label>
      </div>
      <div class="setting-row" id="setting-row-mode">
        <div class="setting-text"><span>Connection Mode</span><small id="mode-desc">Cloud OTP</small></div>
        <label class="switch"><input type="checkbox" id="toggle-mode" checked><span class="slider"></span></label>
      </div>
      <div class="setting-row">
        <div class="setting-text"><span>Ghost Typing</span><small>Live text preview</small></div>
        <label class="switch"><input type="checkbox" id="toggle-ghost"><span class="slider"></span></label>
      </div>
      <div class="setting-row">
        <div class="setting-text"><span>QR Splitter</span></div>
        <!-- Extended max to 20 for smoother scanning -->
        <div class="slider-group"><input type="range" id="qr-slider" min="1" max="20" value="15"><span id="qr-slider-val">15</span></div>
      </div>
      
      <button id="btn-close-settings" class="secondary mt-10">Close</button>
    </div>
  </div>

  <main id="app-container"></main>

  <template id="tpl-chat">
    <div class="view chat-view">
      
      <!-- Collapsible Drawing Toolbar -->
      <div id="draw-toolbar" class="hidden">
        <div id="draw-toolbar-content">
          <div class="color-picker">
            <div class="color-swatch active" data-color="#ff0000" style="background:#ff0000;"></div>
            <div class="color-swatch" data-color="#10b981" style="background:#10b981;"></div>
            <div class="color-swatch" data-color="#3b82f6" style="background:#3b82f6;"></div>
            <div class="color-swatch" data-color="#000000" style="background:#000000;"></div>
            <div class="color-swatch" data-color="#f59e0b" style="background:#f59e0b;"></div>
          </div>
          <div class="draw-actions">
            <button id="btn-draw-undo" class="draw-icon-btn" title="Undo">↶</button>
            <button id="btn-draw-download" class="draw-icon-btn" title="Download">⬇</button>
            <button id="btn-draw-share" class="draw-icon-btn" title="Share">🔗</button>
            <button id="btn-draw-send" class="draw-send-btn">Send</button>
            <button id="btn-draw-close" class="draw-cancel-btn">✕</button>
          </div>
        </div>
        <button id="btn-draw-collapse" title="Hide/Show Toolbar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>

      <div class="chat-wrapper">
        <div id="media-container" class="hidden">
          <button id="btn-fullscreen-cast" class="overlay-btn" title="Fullscreen / Zoom">⛶</button>
          <video id="remote-screen" autoplay playsinline muted></video>
        </div>
        <canvas id="chat-canvas"></canvas>
        <div id="chat-log"></div>
        <div id="scroll-down-btn" class="hidden">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
          <div id="scroll-badge" class="unread-badge hidden">0</div>
        </div>
      </div>
      
      <div id="ghost-typing-container" class="hidden">
        <div class="typing-indicator"><span></span><span></span><span></span></div>
        <div id="ghost-text-preview"></div>
      </div>

      <div id="chat-input-container">
        <div id="reply-preview" class="hidden">
          <div><small style="color: var(--primary); font-weight: bold;">Replying to</small><p id="reply-preview-text">Message preview...</p></div>
          <button id="close-reply">×</button>
        </div>
        <div class="input-row">
          <div class="dice-menu-container">
            <button id="btn-dice" class="icon-btn" title="Tools">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"></circle><circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"></circle><circle cx="12" cy="12" r="1.5" fill="currentColor"></circle></svg>
            </button>
            <div id="dice-menu" class="action-menu">
              <button class="action-btn" id="btn-draw-canvas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><path d="M12 8v8"></path><path d="M8 12h8"></path></svg> Draw on Canvas</button>
              <button class="action-btn" id="btn-draw-chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg> Draw on Chat</button>
              <div class="menu-divider"></div>
              <button class="action-btn" id="btn-screen-cast"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg> Share Screen</button>
              <button class="action-btn" id="btn-set-dir"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg> Set Save Folder</button>
              <div class="menu-divider"></div>
              <button class="action-btn" id="btn-file"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg> Send Files</button>
              <div class="menu-divider"></div>
              <button class="action-btn" id="btn-chat-settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> Settings & Info</button>
            </div>
          </div>
          <input type="file" id="file-input" multiple style="display: none;">
          <textarea id="chat-input" placeholder="Type a message..." autocomplete="off" spellcheck="false"></textarea>
          <button id="btn-send" class="icon-btn primary-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>
    </div>
  </template>

  <div id="context-menu" class="hidden">
    <button class="context-item" id="ctx-reply">Reply</button>
    <button class="context-item" id="ctx-copy">Copy</button>
  </div>

  <script src="qrcode.min.js"></script>
  <script src="html5-qrcode.min.js"></script>
  <script src="utils.js"></script>
  <script src="protocol.js"></script>
  <script src="draw.js"></script>
  <script src="filesystem.js"></script>
  <script src="webrtc.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker Registered successfully:', reg.scope))
        .catch(err => console.error('Service Worker Registration Failed:', err));
    }
  </script>
</body>
</html>
</body>
</html>
