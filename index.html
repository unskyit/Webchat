<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Webchat</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
  <link rel="stylesheet" href="styles.css">
  
  <!-- NEW PWA TAGS -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="icon.svg">
  
</head>
<!-- ... (rest of your body stays exactly the same) ... -->
<body class="light-mode">
  
  <header class="app-header">
    <div class="header-content">
      <div style="display: flex; flex-direction: column;">
        <h2 class="brand">Webchat</h2>
        <small class="brand-sub">by unskyit.com</small>
      </div>
      <button id="btn-settings" class="icon-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
  </header>

  <!-- Settings Overlay -->
  <div id="settings-overlay" class="hidden">
    <div class="settings-card">
      <h3 style="margin-bottom: 20px;">Settings</h3>
      
      <div class="setting-row">
        <span>Dark Mode</span>
        <label class="switch"><input type="checkbox" id="toggle-theme"><span class="slider"></span></label>
      </div>
      
      <div class="setting-row">
        <div class="setting-text">
          <span>Connection Mode</span>
          <small id="mode-desc">Cloud OTP (Requires Internet)</small>
        </div>
        <label class="switch"><input type="checkbox" id="toggle-mode" checked><span class="slider"></span></label>
      </div>

      <div class="setting-row">
        <div class="setting-text">
          <span>QR Code Splitter</span>
          <small>Fewer = Faster. More = Easier to scan.</small>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <input type="range" id="qr-slider" min="1" max="10" value="3" style="width: 80px; padding: 0; margin: 0; border: none; background: transparent;">
          <span id="qr-slider-val" style="font-weight: bold; width: 24px; text-align: right;">3</span>
        </div>
      </div>

      <button id="btn-close-settings" class="secondary" style="margin-top: 10px;">Close</button>
    </div>
  </div>

  <main id="app-container"></main>

  <script src="qrcode.min.js"></script>
  <script src="html5-qrcode.min.js"></script>
  <script src="utils.js"></script>
  <script src="protocol.js"></script>
  <script src="webrtc.js"></script>
  <script src="app.js"></script>
</body>
</html>
