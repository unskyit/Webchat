<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Session UI</title>
    <style>
        /* Base & Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        /* Sleek Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Main Container & Video Area */
        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            /* Prevents the harsh black screen on mobile before video loads */
            background: linear-gradient(135deg, #13151a 0%, #1e2233 100%);
        }

        .main-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Top Bar & Settings */
        .top-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .settings-menu {
            position: absolute;
            top: 55px;
            right: 0;
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 12px;
            display: none; /* Hidden by default */
            white-space: nowrap;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .settings-menu.active {
            display: block;
        }
        .live-count {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: #ff4757;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff4757;
        }

        /* Chat Overlay - Fixed for Mobile */
        .chat-container {
            position: absolute;
            top: 20px;
            left: 20px;
            bottom: 100px;
            width: 300px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            color: #fff; /* High contrast text for mobile visibility */
            width: fit-content;
            max-width: 90%;
        }

        /* Bottom Controls */
        .controls-wrapper {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Vertical Action Menu (Dice Menu) */
        .dice-menu-container {
            position: relative;
        }

        .action-menu {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            background: rgba(20, 20, 25, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .action-menu.active {
            opacity: 1;
            pointer-events: all;
            transform: translateX(-50%) scale(1);
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            width: 140px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            background: #ff4757;
            border-color: #ff4757;
        }
        .btn-danger:hover {
            background: #ff6b81;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .chat-container {
                left: 10px;
                right: 10px;
                width: auto;
                bottom: 90px;
                /* Darker background on mobile to guarantee text readability against video */
                background: rgba(0, 0, 0, 0.65); 
            }
            .controls-wrapper {
                width: 90%;
                justify-content: space-between;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Main Video/Canvas Area -->
    <video class="main-video" autoplay muted playsinline></video>
    
    <!-- Drawing Canvas Placeholder (Hidden by default, manage in JS) -->
    <canvas id="drawCanvas" style="position: absolute; top:0; left:0; width:100%; height:100%; z-index:2; pointer-events:none;"></canvas>

    <!-- Top Right Settings -->
    <div class="top-bar">
        <div style="position: relative;">
            <button class="icon-btn" id="settingsBtn" title="Settings">
                <!-- Gear SVG -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
            <div class="settings-menu" id="settingsMenu">
                <div class="live-count">
                    <span class="live-dot"></span>
                    Live Session Count: <span id="userCount">1</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat/Text Area -->
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="message">Welcome to the session!</div>
            <div class="message">Text visibility on mobile is now fixed.</div>
        </div>
    </div>

    <!-- Bottom Control Bar -->
    <div class="controls-wrapper">
        <!-- Mic -->
        <button class="icon-btn" id="micBtn" title="Toggle Microphone">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
        </button>

        <!-- Video -->
        <button class="icon-btn" id="videoBtn" title="Toggle Camera">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
        </button>

        <!-- Dice Action Menu -->
        <div class="dice-menu-container">
            <button class="icon-btn" id="diceBtn" title="Tools & Actions">
                <!-- Dice SVG -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"></circle>
                    <circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"></circle>
                    <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
                </svg>
            </button>
            
            <!-- Vertical Dropup Menu -->
            <div class="action-menu" id="actionMenu">
                <button class="action-btn" id="drawBtn">
                    <!-- Pencil SVG -->
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                    </svg>
                    Draw
                </button>
                <button class="action-btn" id="screenBtn">
                    <!-- Screencast SVG -->
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                    </svg>
                    Screencast
                </button>
                <button class="action-btn" id="fileBtn">
                    <!-- File SVG -->
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                        <polyline points="13 2 13 9 20 9"></polyline>
                    </svg>
                    Share File
                </button>
            </div>
        </div>

        <!-- End Call -->
        <button class="icon-btn btn-danger" id="endBtn" title="Leave Session">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-7-7 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path>
                <line x1="23" y1="1" x2="1" y2="23"></line>
            </svg>
        </button>
    </div>
</div>

<script>
    // --- UI Interactions ---
    
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsMenu = document.getElementById('settingsMenu');
    
    const diceBtn = document.getElementById('diceBtn');
    const actionMenu = document.getElementById('actionMenu');

    // Toggle Settings Dropdown
    settingsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        settingsMenu.classList.toggle('active');
        actionMenu.classList.remove('active'); // Close action menu if open
    });

    // Toggle Dice Menu
    diceBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        actionMenu.classList.toggle('active');
        settingsMenu.classList.remove('active'); // Close settings if open
    });

    // Close menus when clicking outside
    document.addEventListener('click', (e) => {
        if (!actionMenu.contains(e.target) && !diceBtn.contains(e.target)) {
            actionMenu.classList.remove('active');
        }
        if (!settingsMenu.contains(e.target) && !settingsBtn.contains(e.target)) {
            settingsMenu.classList.remove('active');
        }
    });

    // Prevent closing when clicking inside menus
    actionMenu.addEventListener('click', (e) => e.stopPropagation());
    settingsMenu.addEventListener('click', (e) => e.stopPropagation());

    // --- Action Button Hooks (Integrate your logic here) ---
    document.getElementById('drawBtn').addEventListener('click', () => {
        console.log("Draw toggled");
        // Add your canvas toggle logic here
        actionMenu.classList.remove('active');
    });

    document.getElementById('screenBtn').addEventListener('click', () => {
        console.log("Screencast triggered");
        // Add your screen-sharing logic here
        actionMenu.classList.remove('active');
    });

    document.getElementById('fileBtn').addEventListener('click', () => {
        console.log("File select triggered");
        // Add your file-sharing logic here
        actionMenu.classList.remove('active');
    });
</script>

</body>
</html>
